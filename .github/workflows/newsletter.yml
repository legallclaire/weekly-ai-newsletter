name: Weekly newsletter

on:
  schedule:
    # 07:00 Europe/Paris is 06:00 UTC in winter and 05:00 UTC in summer. Later
    # triggers are backups for late or dropped runs; `newsletter should-send`
    # accepts 07:00-09:59 Paris and skips once today's issue is archived.
    # Off the hour because GitHub delays :00 schedules the most.
    - cron: "3 5,6,7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  # Runs third-party packages on fetched web content, so it only gets a read-only token.
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      send: ${{ steps.gate.outputs.send }}
    env:
      # `uv sync --no-dev` below installs the runtime only; keep `uv run` from syncing dev deps.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --no-dev

      - name: Check send time (Europe/Paris)
        id: gate
        run: |
          # Manual runs may send at any hour, but never twice on the same day.
          flags=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then flags="--any-time"; fi
          send=$(uv run newsletter should-send $flags)
          echo "send=$send" >> "$GITHUB_OUTPUT"

      - name: Build and send the newsletter
        if: steps.gate.outputs.send == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run newsletter run

      - name: Keep archive and history for the commit job
        if: steps.gate.outputs.send == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newsletter-state
          path: |
            archive
            state
          retention-days: 1

  # The only job allowed to write; it runs git alone, no project code.
  commit:
    needs: send
    if: needs.send.outputs.send == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: newsletter-state

      - name: Commit archive and history
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: archive newsletter $(TZ=Europe/Paris date +%F)"
          # main may have moved during the run; rebase so the history is not lost.
          git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" \
            || (sleep 5 && git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH")
