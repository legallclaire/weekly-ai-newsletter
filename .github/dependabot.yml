# Version updates land as PRs on Mondays, so CI has run and they can be merged before
# Wednesday's issue. Minor and patch bumps are grouped to keep the PR count low; security
# updates are opened separately as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
