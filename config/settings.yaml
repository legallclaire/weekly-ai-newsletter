# Newsletter text language: fr or en (code and logs are always English).
language: fr

llm:
  model: claude-sonnet-5-5
  max_tokens: 8192

papers:
  categories: [cs.LG, cs.AI, cs.CL, stat.ML, cs.IR, cs.MA, cs.SE, cs.DC]
  # arXiv announces submissions with a delay; shift the paper window back.
  window_lag_days: 2
  prefilter_size: 50
  batch_size: 10
  min_total: 45      # out of 70
  min_novelty: 6     # out of 10
  max_selected: 3

news:
  max_items: 6
  max_candidates: 80

devtools:
  max_candidates: 60
  # Tools you do not use: shown only for a major announcement, one entry at most.
  secondary_tools: ["GitHub Copilot"]

repos:
  max_items: 5
  repeat_after_weeks: 8
  trending_languages: ["", python]   # "" = all languages

# Recent skills, plugins and MCP servers for coding agents (GitHub search by topic).
extensions:
  max_items: 5
  max_mcp: 2
  created_within_days: 30
  min_stars: 50
  topics: [claude-skills, claude-skill, claude-code-skills, agent-skills, codex-skills,
           claude-code-plugin, mcp-server]
  mcp_topics: [mcp-server]

history_path: state/history.json
archive_dir: archive
